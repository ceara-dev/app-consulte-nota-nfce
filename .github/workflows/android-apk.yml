name: Build APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  apk:
    name: Gerar APK de avaliação
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Aceitar licenças Android
        run: yes | flutter doctor --android-licenses || true

      - name: Instalar dependências
        run: flutter pub get

      - name: Analisar
        run: flutter analyze

      - name: Testes
        run: flutter test

      - name: Gerar APK release
        run: ./scripts/build_apk.sh

      - name: Publicar artifact
        uses: actions/upload-artifact@v4
        with:
          name: nota-clara-apk
          path: |
            dist/*.apk
            dist/*.sha256
          if-no-files-found: error

      - name: Publicar release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/*.sha256
          generate_release_notes: true
